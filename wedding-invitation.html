  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }


    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    #hero {
      z-index: 20;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      will-change: opacity, transform;
      cursor: default;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background: #0f0c09;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1.8s cubic-bezier(.4, 0, .2, 1), transform 2s cubic-bezier(.25, 1, .5, 1), visibility 2s;
      display: flex;
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .hero-bg {
      pointer-events: none;
      z-index: 0;
      filter: brightness(.82);
      background-position: 50% 25%;
      background-repeat: no-repeat;
      background-size: cover;
      position: absolute;
      inset: 0;
    }

    .hero-bg:after {
      content: "";
      background: radial-gradient(at 50% 45%, #0e0b088a 0%, #070504d6 100%);
      position: absolute;
      inset: 0;
    }

    .hero-initial,
    .hero-writing {
      z-index: 2;
      position: relative;
    }

    #hero.leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.04) translateY(-26px);
    }

    .hero-initial {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 32px;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      bottom: calc(clamp(20px, 6.5vh, 52px) + env(safe-area-inset-bottom, 0px));
      bottom: calc(clamp(20px, 6.5dvh, 52px) + env(safe-area-inset-bottom, 0px));
      pointer-events: auto;
      z-index: 10;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 0 20px;
      transition: opacity .45s, transform .45s;
      display: flex;
      opacity: 1;
      visibility: visible;
    }

    .hero-initial.hide {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    .hero-title,
    .btn-tap {
      opacity: 1;
      visibility: visible;
    }

    .hero-writing {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 520px;
      margin-top: clamp(28px, 6vh, 60px);
      display: none;
    }

    .hero-writing.in {
      display: flex;
    }

    .hero-title {
      font-family: var(--serif);
      letter-spacing: .24em;
      text-transform: uppercase;
      color: #e5c583;
      text-shadow: 0 2px 14px #000c, 0 0 22px #e5c58373;
      text-align: center;
      white-space: nowrap;
      margin: 0 0 clamp(14px, 2.8vh, 22px);
      padding-left: .24em;
      font-size: clamp(1.05rem, 4.4vw, 1.75rem);
      font-weight: 400;
      line-height: 1.2;
    }

    .hero-writing-label {
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
      text-shadow: 0 1px 10px #000000b3;
      opacity: 0;
      visibility: hidden;
      margin: 0 0 16px;
      font-size: .7rem;
      font-weight: 400;
      transition: opacity .8s, transform .8s, visibility .8s;
      transform: translateY(-10px);
    }

    .hero-writing.step-label .hero-writing-label {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .hero-writing .script-groom .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-sarayu .script-groom .script-text {
      animation: 1.4s cubic-bezier(.35, 0, .25, 1) forwards writeGroom;
    }

    .hero-writing.step-sarayu .script-groom .calligraphy-spark {
      animation: 1.4s cubic-bezier(.35, 0, .25, 1) forwards sparkMoveGroom;
    }

    .hero-writing .script-amp .amp {
      opacity: 0;
      transition: opacity .5s cubic-bezier(.34, 1.56, .64, 1), transform .5s cubic-bezier(.34, 1.56, .64, 1);
      transform: scale(.6) rotate(-8deg);
    }

    .hero-writing.step-amp .script-amp .amp {
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    .hero-writing .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-jithin .script-bride .script-text {
      animation: 1.4s cubic-bezier(.35, 0, .25, 1) forwards writeBride;
    }

    .hero-writing.step-jithin .script-bride .calligraphy-spark {
      animation: 1.4s cubic-bezier(.35, 0, .25, 1) forwards sparkMoveBride;
    }

    .hero-writing .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320px;
    }

    .hero-writing.step-flourish .flourish-path {
      animation: .9s cubic-bezier(.25, 1, .5, 1) forwards drawFlourish;
    }

    #hero .date {
      color: #fffdf8;
      text-shadow: 0 2px 14px #000000b3;
    }

    #hero .day {
      color: var(--gold-soft);
      letter-spacing: .34em;
    }

    #hero .tag {
      color: #ffffffd1;
      text-shadow: 0 1px 8px #000000b3;
    }

    #hero .script-text {
      color: #fffaf0;
      text-shadow: 0 2px 24px #dcc9a0a6, 0 0 12px #ffffff59;
    }

    #hero .script-amp .amp {
      color: var(--gold-soft);
      text-shadow: 0 2px 16px #b8985ab3;
    }

    .btn-tap {
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      border: 1px solid var(--gold);
      min-height: 44px;
      height: 44px;
      line-height: 1;
      font: 500 .72rem var(--sans);
      letter-spacing: .25em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px #00000080;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background: #ffffff26;
      border-radius: 999px;
      justify-content: center;
      align-items: center;
      padding: 0 30px;
      transition: transform .35s, background .35s, border-color .35s, box-shadow .35s;
      animation: 2.4s ease-in-out infinite btnPulse;
      display: inline-flex;
      position: relative;
      box-shadow: 0 6px 20px #00000059, 0 0 12px #daa52040;
      z-index: 15;
    }

    .btn-tap:after {
      content: "";
      cursor: pointer;
      position: absolute;
      inset: -14px -24px;
    }

    .btn-tap:hover {
      background: #ffffff42;
      border-color: #eed79b;
      transform: scale(1.04);
      box-shadow: 0 8px 26px #00000073, 0 0 20px #daa52073;
    }

    @keyframes btnPulse {

      0%,
      to {
        background: #ffffff24;
        border-color: #d4af37bf;
        transform: scale(1);
        box-shadow: 0 4px 18px #00000059, 0 0 12px #daa52038;
      }

      50% {
        background: #ffffff38;
        border-color: #ebcd82f2;
        transform: scale(1.03);
        box-shadow: 0 6px 24px #00000073, 0 0 20px #daa52073;
      }
    }

    .hero-writing-date {
      text-align: center;
      opacity: 0;
      visibility: hidden;
      margin-top: 24px;
      transition: opacity .85s cubic-bezier(.25, 1, .5, 1), transform .85s cubic-bezier(.25, 1, .5, 1), visibility .85s;
      transform: translateY(14px);
    }

    .hero-writing.step-date .hero-writing-date {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .hwd-day {
      font-family: var(--sans);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
      text-shadow: 0 1px 8px #000000b3;
      margin-bottom: 6px;
      font-size: .75rem;
      font-weight: 500;
    }

    .hwd-date {
      font-family: var(--serif);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #fffdf8;
      text-shadow: 0 2px 16px #000c, 0 0 24px #dcc9a059;
      font-size: clamp(1.4rem, 4.6vw, 1.85rem);
      line-height: 1.2;
    }

    .arch {
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      width: min(34vw, 160px, 16.5svh);
      margin-bottom: clamp(18px, 4svh, 32px);
      padding: 5px;
    }

    .arch img {
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 26%;
      text-align: left
    }

    .ph {
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(60, 50, 30, .12);
      background: var(--cream)
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 2.6s ease
    }

    .in.ph img,
    .in .ph img {
      transform: none
    }

    .ga {
      width: 80%;
      aspect-ratio: 4/5
    }

    .ga img {
      object-position: 50% 28%
    }

    .gb {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 54%;
      aspect-ratio: 3/4;
      border: 6px solid var(--ivory)
    }

    .gb img {
      object-position: 50% 36%
    }

    @media(prefers-reduced-motion:reduce) {
      .ph img {
        transition: none;
        transform: none
      }
    }

    /* hero sequence */
    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    .in .line-x,
    .line-x.in {
      transform: scaleX(1)
    }

    /* date */
    .daynum {
      font-family: var(--serif);
      font-size: clamp(6rem, 30vw, 10rem);
      line-height: .9;
      font-weight: 300;
      color: var(--ink)
    }

    .month {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      margin-top: 8px;
      padding-left: .3em
    }

    .time {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-top: 8px
    }

    .pin {
      width: 22px;
      height: 22px;
      color: var(--gold);
      margin-bottom: 18px
    }

    .note {
      font-family: var(--serif);
      font-style: italic;
      color: var(--mute);
      font-size: 1.15rem;
      margin-top: 22px
    }

    /* families */
    .fam {
      display: grid;
      gap: 56px;
      max-width: 860px;
      margin: 56px auto 0
    }

    .fam h3 {
      font-size: 1.6rem;
      line-height: 1.3;
      margin: 0 0 14px
    }

    .fam .label {
      margin-bottom: 18px
    }

    .fam p {
      margin: 0;
      color: var(--mute);
      font-size: .95rem
    }

    .fam .sep {
      width: 1px;
      height: 56px;
      background: var(--gold-soft);
      margin: 0 auto;
      display: none
    }

    @media(min-width:760px) {
      .fam {
        grid-template-columns: 1fr 1px 1fr;
        gap: 48px;
        align-items: start
      }

      .fam .sep {
        display: block;
        height: 100%;
        min-height: 200px
      }
    }

    .comp {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      line-height: 1.9
    }

    .comp span {
      padding: 0 clamp(10px, 3vw, 20px);
      white-space: nowrap
    }

    .comp span+span {
      border-left: 1px solid var(--gold-soft)
    }

    .foot {
      padding: 48px 24px 56px;
      text-align: center;
      border-top: 1px solid var(--gold-soft)
    }

    .foot .serif {
      font-size: 1.4rem;
      letter-spacing: .2em
    }

    @media(prefers-reduced-motion:reduce) {

      .seq,
      .r,
      .line-x,
      .btn-tap,
      .preloader-init,
      .preloader-reveal,
      .preloader-names,
      .preloader-date-block {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>
  <audio id="wedding-audio" loop preload="auto">
    <source src="/music/song.mp3" type="audio/mpeg">
    <source src="music/song.mp3" type="audio/mpeg">
    <source
      src="/music/thattathin%20marayathu%E2%9C%A8%EF%B8%8F%20%23nostalgia%20%23lovebgm%20%23nivinpauly%20%23hearttouching.mp3"
      type="audio/mpeg">
    <source
      src="music/thattathin%20marayathu%E2%9C%A8%EF%B8%8F%20%23nostalgia%20%23lovebgm%20%23nivinpauly%20%23hearttouching.mp3"
      type="audio/mpeg">
  </audio>
  <main id="app"></main>
  <footer class="foot">
    <div class="serif" id="fmono"></div>
    <div class="small" style="margin-top:8px" id="fdate"></div>
  </footer>

  <script>
    /* ===== Central wedding data — edit here only ===== */
    const W = {
      bride: "Sarayu", groom: "Jithin", brideFirst: "Sarayu", groomFirst: "Jithin", monogram: "S • J", footMono: "S & J",
      short: "Sarayu & Jithin",
      date: { full: "12 December 2026", day: "Saturday", num: "12", month: "December 2026", dots: "12 • 12 • 2026", dotted: "12.12.2026", malayalam: "1202 Vrischikam 26" },
      time: "8:30 AM – 9:00 AM",
      muhurtham: "8:30 AM – 9:00 AM",
      reception: "From 9:00 AM onwards", notice: "",
      venue: { name: "River Coasta Retreat (Resort)", place: "Moorad Bridge, Palayad, Iringal, Vadakara – 673521", map: "https://maps.app.goo.gl/JuVEBWg2AFFhSMiq6?g_st=iw" },
      tagline: "A celebration of love, family & togetherness",
      quotes: ["Our love began as a story, and today we make a promise to turn it into forever.", "A beautiful marriage is not something you find, it is something you build together."],
      invite: "We cordially invite your gracious presence and blessings on the auspicious occasion of the wedding ceremony of our Daughter Sarayu with Jithin.",
      families: [
        { title: "Bride's Family", names: "Kumaran & Chandrika", lines: ["Edavanaparambil", "Palayad, Iringal, Vadakara – 673521"] },
        { title: "Groom's Family", names: "Sathyan (Late) & Kousallya", lines: [] }
      ],
      compliments: ["Family & Friends", "Near & Dear"]
    };
    const PHOTOS = {
      main: "/preview.png",
      preloader: "/image.png",
      a: "/preview.png",
      b: "/image%20copy.png"
    };
    /* ===== Render ===== */
    const orn = '<svg class="orn r" viewBox="0 0 150 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 9h55M95 9h55"/><circle cx="75" cy="9" r="4"/><circle cx="65" cy="9" r="2.5"/><circle cx="85" cy="9" r="2.5"/></svg>';
    const pin = '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>';
    const D = W.date, V = W.venue;
    document.getElementById('app').innerHTML = `
<section id="hero">
  <div class="hero-bg" aria-hidden="true" style="background-image: url('${PHOTOS.preloader}');"></div>
  
  <div class="hero-initial" id="hero-initial">
    <h1 class="hero-title">Wedding Invitation</h1>
    <button type="button" class="btn btn-tap" id="btn-open" aria-label="Tap to Open Wedding Invitation">Tap to Open</button>
  </div>

  <div class="hero-writing" id="hero-writing" aria-hidden="true">
    <p class="hero-writing-label">Together with their families</p>
    <div class="intro-names hero-names" id="hero-names" aria-label="${W.bride} & ${W.groom}">
      <div class="script-line script-groom">
        <span class="script-text">${W.bride}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="script-line script-amp" aria-hidden="true">
        <span class="amp">&amp;</span>
      </div>
      <div class="script-line script-bride">
        <span class="script-text">${W.groom}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="flourish-wrap" aria-hidden="true">
        <svg class="calligraphy-flourish" viewBox="0 0 280 26" fill="none" preserveAspectRatio="none">
          <path class="flourish-path" d="M14,14 C65,4 105,6 140,16 C175,24 215,10 266,8" stroke="url(#goldFlourishGradHero)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="goldFlourishGradHero" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(220, 201, 160, 0.2)" />
              <stop offset="35%" stop-color="rgba(184, 152, 90, 0.95)" />
              <stop offset="70%" stop-color="rgba(218, 165, 32, 0.95)" />
              <stop offset="100%" stop-color="rgba(220, 201, 160, 0.2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>
    <div class="hero-writing-date" id="hero-writing-date">
      <div class="hwd-day">${D.day}</div>
      <div class="hwd-date">${D.full}</div>
    </div>
  </div>
</section>

<section id="intro">
  <div class="cover r"><img src="${PHOTOS.main}" alt="${W.bride} and ${W.groom}" decoding="async"></div>
  <div class="wrap">
    <p class="label r">Together with their families</p>
    <h2 class="intro-names r" aria-label="${W.bride} & ${W.groom}">
      <div class="script-line script-groom">
        <span class="script-text">${W.bride}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="script-line script-amp" aria-hidden="true">
        <span class="amp">&amp;</span>
      </div>
      <div class="script-line script-bride">
        <span class="script-text">${W.groom}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="flourish-wrap" aria-hidden="true">
        <svg class="calligraphy-flourish" viewBox="0 0 280 26" fill="none" preserveAspectRatio="none">
          <path class="flourish-path" d="M14,14 C65,4 105,6 140,16 C175,24 215,10 266,8" stroke="url(#goldFlourishGrad)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="goldFlourishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(220, 201, 160, 0.2)" />
              <stop offset="35%" stop-color="rgba(184, 152, 90, 0.95)" />
              <stop offset="70%" stop-color="rgba(218, 165, 32, 0.95)" />
              <stop offset="100%" stop-color="rgba(220, 201, 160, 0.2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </h2>
    ${orn}
    <p class="quote r">“${W.quotes[0]}”</p>
  </div>
</section>

<section class="alt"><div class="wrap">
  <p class="label r">The wedding day</p>
  <div class="daynum r">${D.num}</div>
  <div class="month r">${D.month.toUpperCase()}</div>
  <div class="day r" style="margin-top:10px">${D.day}</div>
  <div class="rule line-x r"></div>
  <div class="small r" style="letter-spacing:.2em;text-transform:uppercase;margin-top:8px;color:var(--mute)">Muhurtham</div>
  <div class="time r">${W.muhurtham || W.time}</div>
  <div class="small r" style="margin-top:6px">${D.malayalam}</div>
</div></section>

<section><div class="wrap">
  <p class="label r">The venue</p>
  <div class="r">${pin}</div>
  <h2 class="big r">${V.name}</h2>
  <p class="small r" style="margin-top:10px;font-size:1rem;line-height:1.6">${V.place}</p>
  ${V.map ? `<div style="margin-top:22px"><a class="btn r" href="${V.map}" target="_blank" rel="noopener noreferrer">View on Google Maps</a></div>` : ''}
</div></section>

${W.reception ? `<section class="alt"><div class="wrap">
  <p class="label r">Reception</p>
  <h2 class="big r" style="font-size:clamp(1.9rem,6vw,2.6rem)">${W.reception}</h2>
  ${W.notice ? `<div class="rule line-x r"></div><p class="note r">${W.notice}</p>` : ''}
</div></section>` : ''}

<section><div class="wrap">
  ${orn}
  <p class="body r">${W.invite}</p>
  ${orn}
</div></section>

<section class="alt"><div class="wrap" style="max-width:900px">
  <p class="label r">With the blessings of our families</p>
  <div class="fam">
    ${W.families[0] ? fam(W.families[0]) : ''}
    <div class="sep line-x"></div>
    ${W.families[1] ? fam(W.families[1]) : ''}
  </div>
</div></section>

<section style="background:linear-gradient(180deg,var(--ivory),var(--blush) 55%,var(--ivory))"><div class="wrap">
  <div class="rule line-x r" style="margin-top:0"></div>
  <p class="quote r">“${W.quotes[1]}”</p>
  <div class="rule line-x r"></div>
</div></section>

<section><div class="wrap" style="max-width:560px">
  <div class="gal">
    <div class="ph ga r"><img src="${PHOTOS.a}" alt="${W.bride} and ${W.groom}" loading="lazy" decoding="async"></div>
    <div class="ph gb r"><img src="${PHOTOS.b}" alt="${W.bride} and ${W.groom}" loading="lazy" decoding="async"></div>
  </div>
</div></section>

<section><div class="wrap">
  <p class="label r">Best compliments from</p>
  <div class="comp r">${W.compliments.map(n => `<span>${n}</span>`).join('')}</div>
</div></section>

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>`;
    function fam(f) {
      return `<div class="r">
  <p class="label">${f.title}</p>
  <h3>${f.names}</h3>
  ${f.lines && f.lines.length ? `<p>${f.lines.join('<br>')}</p>` : ''}
</div>` }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let openingStarted = false;
    let opened = false;

    function startOpeningSequence() {
      if (openingStarted) return;
      openingStarted = true;

      // 1. Play background music on guest tap
      playAudio();

      const heroInitial = document.getElementById('hero-initial');
      const heroWriting = document.getElementById('hero-writing');

      // 2. Hide initial prompt smoothly
      if (heroInitial) {
        heroInitial.classList.add('hide');
      }

      // 3. Reveal writing container and orchestrate strict chronological flow:
      // Step 1: "Together with their families"
      // Step 2: "Sarayu"
      // Step 3: "&"
      // Step 4: "Jithin"
      // Step 5: Golden Flourish
      // Step 6: "Saturday" & "12 December 2026"
      // Step 7: Open invitation slowly
      setTimeout(() => {
        if (heroInitial) heroInitial.style.display = 'none';
        if (heroWriting) {
          heroWriting.style.display = 'flex';
          void heroWriting.offsetWidth;

          // Step 1: "Together with their families" fades down
          setTimeout(() => {
            heroWriting.classList.add('step-label');
          }, 150);

          // Step 2: "Sarayu" writes in animated calligraphy
          setTimeout(() => {
            heroWriting.classList.add('step-sarayu');
          }, 1000);

          // Step 3: "&" reveals
          setTimeout(() => {
            heroWriting.classList.add('step-amp');
          }, 2500);

          // Step 4: "Jithin" writes in animated calligraphy
          setTimeout(() => {
            heroWriting.classList.add('step-jithin');
          }, 3100);

          // Step 5: Golden flourish draws under names
          setTimeout(() => {
            heroWriting.classList.add('step-flourish');
          }, 4600);

          // Step 6: "Saturday" & "12 December 2026" rises into view
          setTimeout(() => {
            heroWriting.classList.add('step-date');
          }, 5500);

          // Step 7: Pause to appreciate completed view, then open invitation slowly
          setTimeout(() => {
            openInviteSlowly();
          }, 8200);
        }
      }, 350);
    }

    function openInviteSlowly() {
      if (opened) return;
      opened = true;

      const hero = document.getElementById('hero');
      if (hero) hero.classList.add('leaving');

      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      scrollTo(0, 0);

      document.querySelectorAll('.r').forEach(el => io.observe(el));

      setTimeout(() => {
        const inames = document.querySelector('#intro .intro-names');
        if (inames) inames.classList.add('in');
      }, 500);
    }

    /* ===== Tap Handling: ONLY tapping the "Tap to Open" button opens the invitation ===== */
    const btnOpen = document.getElementById('btn-open');
    if (btnOpen) {
      btnOpen.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        if (!openingStarted) {
          startOpeningSequence();
        }
      });
      btnOpen.addEventListener('touchend', e => {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
        if (!openingStarted) {
          startOpeningSequence();
        }
      }, { passive: false });
    }

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
